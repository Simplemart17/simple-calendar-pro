name: Web Quality

on:
  pull_request:
    paths:
      - "calendar-web/**"
      - ".github/workflows/web-quality.yml"
  push:
    branches:
      - main
    paths:
      - "calendar-web/**"
      - ".github/workflows/web-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
